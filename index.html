<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Шиномонтаж 19А — Льва Толстого, Уфа</title>
<meta name="theme-color" content="#0c0b09"/>
<style>body{margin:0;background:#0c0b09;color:#f3eee4;font-family:system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}</style>
</head><body><p>Загрузка…</p>
<script>
(async()=>{
  const n=5;
  const parts=[];
  for(let i=0;i<n;i++){
    const r=await fetch('parts/p'+i+'.txt',{cache:'no-cache'});
    if(!r.ok) throw new Error('part '+i);
    parts.push(await r.text());
  }
  document.open();document.write(parts.join(''));document.close();
})().catch(e=>{document.body.innerHTML='<p>Ошибка загрузки</p>';console.error(e);});
</script></body></html>
